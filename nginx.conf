worker_processes auto;
events { worker_connections 1024; }

http {
    # Docker's embedded DNS returns one A record per `api` replica. `resolve` (nginx >= 1.27.3)
    # makes nginx query it directly and re-resolve every 5 s, so all replicas are used and
    # `docker compose up --scale api=N` takes effect without restarting nginx.
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream api_pool {
        zone api_pool 64k;
        server api:8000 resolve;  # round-robin across every replica behind this name
    }
    upstream trainer {
        zone trainer 64k;
        server trainer:8000 resolve;
    }

    log_format upstreamlog '$remote_addr "$request" $status upstream=$upstream_addr rt=$request_time';
    access_log /var/log/nginx/access.log upstreamlog;

    client_max_body_size 200m;   # bulk uploads; the API enforces 5 MB per file
    proxy_read_timeout 120s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    server {
        listen 80;

        # Uploads and retraining go to the single trainer service.
        location ~ ^/(upload|retrain) {
            proxy_pass http://trainer;
        }

        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://api_pool;
        }
    }
}
